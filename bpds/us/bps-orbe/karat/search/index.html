<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://*.onion https: repo:; media-src 'self' data: http://*.onion https: repo:; connect-src 'self' http://*.onion https:">
<meta charset="UTF-8">
<title>Karat Search</title>
<link rel="icon" type="image/png" href="android-chrome-512x512.png">
<bpds bpds-cntry="us" bpds-toplvldom="search" bpds-dom="bps-orbe" bpds-subdom="karat"/>
<style>
* { box-sizing: border-box; margin: 0; }
body { font-family: system-ui, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
.search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
.search-bar input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; }
.tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 16px; }
.tab { padding: 10px 18px; cursor: pointer; font-size: 14px; }
.tab.active { border-bottom: 2px solid darkorange; font-weight: 600; color: orange; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.card { border-radius: 8px; overflow: hidden; background-color: lightgrey; }
.card img { width: 100%; height: auto; max-height: 300px; object-fit: contain; }
.card .title { font-size: 13px; padding: 6px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.web-result { margin-bottom: 16px; background-color: lightgrey; border-radius: 8px; padding: 10px; }
.web-result a { font-size: 15px; color: black; text-decoration: none; }
.web-result .snippet { font-size: 13px; color: #545454; margin-top: 4px; }
.web-result .url { font-size: 12px; color: darkcyan; }
.audio-item { margin-bottom: 10px; background-color: lightgrey; border-radius: 8px; padding: 10px; }
.load-more { display: block; margin: 16px auto; padding: 10px 28px; cursor: pointer; font-size: 14px; border: 1px solid #ddd; border-radius: 6px; background: #fff; }
.load-more:disabled { opacity: 0.5; }
.status { text-align: center; font-size: 12px; color: #999; margin-top: 8px; }
</style>
</head>
<body>

<div class="search-bar">
  <input id="q" type="text" placeholder="Search..." onkeydown="if(event.key==='Enter')doSearch()">
  <button onclick="doSearch()" style="padding:10px 20px;border:none;border-radius:6px;background:orange;color:#fff;cursor:pointer">Search</button>
</div>

<div class="tabs">
  <div class="tab active" data-tab="general" onclick="switchTab('general')">Web</div>
  <div class="tab" data-tab="news" onclick="switchTab('news')">News</div>
  <div class="tab" data-tab="images" onclick="switchTab('images')">Images</div>
  <div class="tab" data-tab="videos" onclick="switchTab('videos')">Videos</div>
  <div class="tab" data-tab="music" onclick="switchTab('music')">Audio</div>
</div>

<div id="results"></div>
<button class="load-more" id="loadMoreBtn" onclick="loadMore()" style="display:none">Load More</button>
<div class="status" id="status"></div>

<script>
const params = new URLSearchParams(window.location.search);
const initialQuery = params.get('q');
if (initialQuery) {
  document.getElementById('q').value = initialQuery;
  setTimeout(() => doSearch(), 300);
}

let currentTab = 'general';
let allData = { general: [], news: [], images: [], videos: [], music: [] };
let currentPage = 1;
let query = '';

// ── URL classification helpers ──
const VIDEO_URLS = /(?:youtube\.com\/watch|youtu\.be\/|vimeo\.com\/|dailymotion\.com\/|twitch\.tv\/videos|\.mp4|\.webm|\.ogg|\.mov|\.avi|\.mkv)(\?|$)/i;
const AUDIO_URLS = /\.(mp3|ogg|oga|wav|flac|m4a|aac|opus|webm|wma|aiff|alac)(\?|$)|soundcloud\.com\/|bandcamp\.com\/|archive\.org\/details|podcast|\.rss|librivox\.org|freesound\.org|snd\.cloud|audiomack\.com|tunein\.com|player\.fm|overcast\.fm|anchor\.fm|simplecast\.com|transistor\.fm|podcast\.app|music\.brainz\.org/i;
const IMAGE_URLS = /\.(jpg|jpeg|png|gif|webp|svg|bmp|ico|avif)(\?|$)|imgur\.com\/|flickr\.com\/photos/i;
const NEWS_SITES = /(?:reuters\.com|apnews\.com|bbc\.com|cnn\.com|nytimes\.com|washingtonpost\.com|theverge\.com|arstechnica\.com|techcrunch\.com|bloomberg\.com|ft\.com|wsj\.com|npr\.org|theguardian\.com|aljazeera\.com|dw\.com|france24\.com|nhk\.or\.jp|bbc\.co\.uk|nydailynews\.com|usatoday\.com|foxnews\.com|cbsnews\.com|nbcnews\.com|politico\.com|economist\.com|newyorker\.com|time\.com|newsweek\.com|thehill\.com|axios\.com|cnbc\.com|marketwatch\.com)/i;

function classifyResult(r) {
  // Image results are tagged by SearXNG's result-images class
  if (r.isImage) return 'images';
  const url = r.url || '';
  if (VIDEO_URLS.test(url)) return 'videos';
  if (AUDIO_URLS.test(url)) return 'music';
  if (IMAGE_URLS.test(url)) return 'images';
  if (NEWS_SITES.test(url) || r.date) return 'news';
  return 'general';
}   

function getDomain(url) {
  try { return new URL(url).hostname.replace('www.', ''); }
  catch { return ''; }
}

function getFavicon(url) {
  try {
    const u = new URL(url);
    return `${u.protocol}//${u.hostname}/favicon.ico`;
  } catch { return ''; }
}     

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function distributeResults(rawResults) {
  const dist = { general: [], news: [], images: [], videos: [], music: [] };
  for (const r of rawResults) {
    const tab = classifyResult(r);
    dist[tab].push(r);
  }
  return dist;
}

async function doSearch() {
  query = document.getElementById('q').value.trim();
  if (!query) return;
  currentPage = 1;
  allData = { general: [], news: [], images: [], videos: [], music: [] };

  const btn = document.getElementById('loadMoreBtn');
  btn.style.display = 'block';
  btn.disabled = true;
  btn.textContent = 'Searching...';
  document.getElementById('status').textContent = '';

  const rawResults = await electronAPI.karatSearch(query, 'general,news,images,videos,music', 1);
  const dist = distributeResults(Array.isArray(rawResults) ? rawResults : []);
  allData.general = dist.general;
  allData.news = dist.news;
  allData.images = dist.images;
  allData.videos = dist.videos;
  allData.music = dist.music;

  btn.disabled = false;
  btn.textContent = `Load More (page ${currentPage})`;
  document.getElementById('status').textContent = '';
  renderTab(currentTab);
}

async function loadMore() {
  currentPage++;
  const btn = document.getElementById('loadMoreBtn');
  btn.disabled = true;
  btn.textContent = 'Loading...';

  const rawResults = await electronAPI.karatSearch(query, 'general,news,images,videos,music', currentPage);
  const dist = distributeResults(Array.isArray(rawResults) ? rawResults : []);

  let hadNew = false;
  for (const tab of ['general', 'news', 'images', 'videos', 'music']) {
    if (dist[tab].length > 0) {
      hadNew = true;
      const existing = new Set(allData[tab].map(x => x.url));
      const fresh = dist[tab].filter(x => !existing.has(x.url));
      allData[tab].push(...fresh);
    }
  }

  if (!hadNew) {
    currentPage--;
    btn.textContent = 'No more results';
    btn.disabled = true;
  } else {
    btn.textContent = `Load More (page ${currentPage})`;
  }
  btn.disabled = false;
  document.getElementById('status').textContent = '';
  renderTab(currentTab);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderTab(tab);
}

function renderTab(tab) {
  const el = document.getElementById('results');
  const results = allData[tab] || [];

  const faviconRow = (r) => `
  <div style="display:flex;align-items:center;gap:4px">
    <img src="${getFavicon(r.url)}" width="12" height="12" style="width:12px;height:12px;border-radius:2px" onerror="this.style.visibility='hidden'">
    <span style="font-size:11px;color:#555">${escapeHtml(getDomain(r.url) || r.source || '')}</span>
  </div>`;   

  if (tab === 'images') {
    const validImages = results.filter(r => {
      const src = r.img_src || r.thumbnail || '';
      return src && (src.startsWith('http://') || src.startsWith('https://') || src.startsWith('data:'));
    });

    if (validImages.length === 0) {
      el.innerHTML = '<p style="color:#999">No image results found.</p>';
    } else {
      el.innerHTML = `<div class="grid">${validImages.map(r => `
        <div class="card">
          <img src="${escapeHtml(r.img_src || r.thumbnail)}" loading="lazy" alt="" onerror="this.parentElement.style.display='none'">
          <div class="title">${escapeHtml(r.title || '')}</div>
          <div style="padding:0 8px 4px">${faviconRow(r)}</div>
          <a href="${escapeHtml(r.url)}" target="_blank" style="font-size:11px;color:#4a90d9;padding:0 8px 8px;display:inline-block">Source &rarr;</a>
        </div>`).join('')}</div>`;
    }

  } else if (tab === 'videos') {
    el.innerHTML = `<div class="grid">${results.map(r => `
      <div class="card" style="cursor:pointer" onclick="window.electronAPI.openPopup('${escapeHtml(r.url)}')">
        ${r.thumbnail ? `<img src="${escapeHtml(r.thumbnail)}" loading="lazy" alt="">` : ''}
        <div class="title">${escapeHtml(r.title || '')}</div>
        <div style="padding:0 8px 4px">${r.channel ? `<span style="font-size:11px;color:#666">${escapeHtml(r.channel)}${r.duration ? ' · ' + escapeHtml(r.duration) : ''}</span>` : faviconRow(r)}</div>
        <div style="font-size:12px;color:#4a90d9;padding:0 8px 8px">&#9654; Click to play</div>
      </div>`).join('')}</div>`;

  } else if (tab === 'music') {
    el.innerHTML = results.map(r => `
      <div class="audio-item" style="display:flex;gap:12px;align-items:center;cursor:pointer" onclick="window.electronAPI.openPopup('${escapeHtml(r.url)}')">
        ${r.thumbnail ? `<img src="${escapeHtml(r.thumbnail)}" style="width:50px;height:50px;border-radius:6px;object-fit:cover" alt="">` : `<img src="${getFavicon(r.url)}" width="50" height="50" style="border-radius:6px" onerror="this.style.visibility='hidden'">`}
        <div style="flex:1">
          <div style="font-size:14px">${escapeHtml(r.title || r.url)}</div>
          <div style="font-size:11px;color:#999">${escapeHtml(r.channel || getDomain(r.url))}${r.duration ? ' · ' + escapeHtml(r.duration) : ''}</div>
          <div style="font-size:12px;color:#4a90d9;margin-top:4px">&#9654; Click to play</div>
        </div>
      </div>`).join('') || '<p style="color:#999">No audio results found.</p>';

  } else if (tab === 'news') {
    el.innerHTML = results.map(r => `
      <div class="web-result" style="display:flex;gap:12px;align-items:flex-start">
        ${r.thumbnail ? `<img src="${escapeHtml(r.thumbnail)}" style="width:120px;height:68px;object-fit:cover;border-radius:6px" alt="">` : ''}
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
            <img src="${getFavicon(r.url)}" width="16" height="16" style="border-radius:2px" onerror="this.style.visibility='hidden'">
            <span style="font-size:12px;color:#0d652d">${escapeHtml(getDomain(r.url))}</span>
            ${r.source ? `<span style="font-size:11px;color:#999">via ${escapeHtml(r.source)}</span>` : ''}
          </div>
          <a href="${escapeHtml(r.url)}" target="_blank">${escapeHtml(r.title)}</a>
          <div class="snippet">${escapeHtml(r.content || '')}</div>
          <div class="url">${r.date ? escapeHtml(r.date) + ' · ' : ''}${escapeHtml(r.url)}</div>
        </div>
      </div>`).join('') || '<p style="color:#999">No news results found.</p>';

  } else {
    el.innerHTML = results.map(r => `
      <div class="web-result">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
          <img src="${getFavicon(r.url)}" width="16" height="16" style="border-radius:2px" onerror="this.style.visibility='hidden'">
          <span style="font-size:12px;color:#0d652d">${escapeHtml(getDomain(r.url))}</span>
          ${r.source ? `<span style="font-size:11px;color:#999">via ${escapeHtml(r.source)}</span>` : ''}
        </div>
        <a href="${escapeHtml(r.url)}" target="_blank">${escapeHtml(r.title)}</a>
        <div class="snippet">${escapeHtml(r.content || '')}</div>
        <div class="url">${escapeHtml(r.url)}</div>
      </div>`).join('') || '<p style="color:#999">No results found.</p>';
  }

  document.getElementById('status').textContent = `${results.length} results`;
}   
</script>
</body>
</html>
