<script>
  
let ytPageToken = '';
  
function resolveUrl(rawSrc, pageUrl) {
  if (!rawSrc) return '';
  if (rawSrc.startsWith('//')) return 'https:' + rawSrc;
  if (rawSrc.startsWith('data:') || rawSrc.startsWith('blob:')) return '';
  try { return new URL(rawSrc, pageUrl).href; }
  catch { return ''; }
}   
  
async function scanForMedia() {
  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.textContent = 'Scanning pages...';
  document.getElementById('status').textContent = 'Fetching result pages and extracting media...';

  const urls = [
    ...allData.general.map(r => r.url),
    ...allData.news.map(r => r.url)
  ];

  const { newImages, newVideos, newAudio } = await scanResultsForMedia(urls, 10);

  allData.images.push(...newImages);
  allData.videos.push(...newVideos);
  allData.music.push(...newAudio);

  const total = newImages.length + newVideos.length + newAudio.length;
  document.getElementById('status').textContent =
    `Found ${newImages.length} images, ${newVideos.length} videos, ${newAudio.length} audio from scanned pages`;

  btn.disabled = false;
  btn.textContent = 'Scan more pages';

  renderTab(currentTab);
}   
  
function getDomain(url) {
  try { return new URL(url).hostname.replace('www.', ''); }
  catch { return ''; }
}   
  
  async function getWorkingPipedInstances() {
  try {
    const resp = await fetch('https://raw.githubusercontent.com/jayxdcode/piped-instances/main/public/lite.json', {
      headers: { 'User-Agent': UA },
      signal: AbortSignal.timeout(10000)
    });
    if (!resp.ok) return [];
    const data = await resp.json();
    
    return (data.instances || [])
      .filter(i => i.metrics?.search_success_rate === 1)
      .map(i => i.api_url);
  } catch { return []; }
}
  
//\STATE
let currentTab = 'general';
let allData = { general: [], news: [], images: [], videos: [], music: [] };
let currentPage = 1;
let query = '';
let vqdToken = '';

//\HELPERS
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function decodeDDGUrl(href) {
  if (!href) return '';
  try {
    const url = new URL(href, 'https://duckduckgo.com');
    if (url.pathname === '/l/' || url.pathname === '/html/l/') {
      const uddg = url.searchParams.get('uddg');
      if (uddg) return decodeURIComponent(uddg);
    }
    return href;
  } catch { return href; }
}

const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36';

//\WEB & NEWS

let ddgNextParams = null;

async function ddgHtmlSearch(query, pageno) {
  if (pageno === 3) {
    return bingWebSearch(query, pageno);
  }

  let body;
  if (pageno === 1) {
    ddgNextParams = null;
    body = new URLSearchParams({ q: query, kl: 'us-en', kp: '-2' });
  } else {
    if (!ddgNextParams) return bingWebSearch(query, pageno);
    body = new URLSearchParams(ddgNextParams);
    body.set('kp', '-2');
  }

  const resp = await fetch('https://html.duckduckgo.com/html/', {
    method: 'POST',
    headers: {
      'User-Agent': UA,
      'Content-Type': 'application/x-www-form-urlencoded',
      'Accept': 'text/html'
    },
    body: body.toString(),
    signal: AbortSignal.timeout(15000)
  });

  if (!resp.ok) return bingWebSearch(query, pageno);

  const html = await resp.text();
  const doc = new DOMParser().parseFromString(html, 'text/html');

  const results = [];
  doc.querySelectorAll('div.result').forEach(el => {
    const a = el.querySelector('a.result__a');
    const snippet = el.querySelector('.result__snippet');
    if (!a) return;

    let url = a.href;
    try {
      const u = new URL(url, 'https://html.duckduckgo.com');
      const uddg = u.searchParams.get('uddg');
      if (uddg) url = decodeURIComponent(uddg);
    } catch {}

    results.push({
      url,
      title: a.textContent.trim(),
      content: snippet ? snippet.textContent.trim() : ''
    });
  });

  ddgNextParams = null;
  const forms = doc.querySelectorAll('form');
  for (const f of forms) {
    const vqdInput = f.querySelector('input[name="vqd"]');
    if (vqdInput) {
      const params = {};
      f.querySelectorAll('input').forEach(inp => {
        if (inp.name) params[inp.name] = inp.value;
      });
      ddgNextParams = params;
      break;
    }
  }

  return results;
}           

  async function bingWebSearch(query, pageno) {
  const first = (pageno - 1) * 50 + 1;
  const target = `https://www.bing.com/search?q=${encodeURIComponent(query)}&first=${first}&count=50&adlt=off`;   

  const resp = await fetch(target, {
    headers: { 'User-Agent': UA, 'Accept-Language': 'en-US,en;q=0.9' },
    signal: AbortSignal.timeout(15000)
  });
  if (!resp.ok) return [];

  const html = await resp.text();

  if (!html.includes('b_algo')) return [];

  const doc = new DOMParser().parseFromString(html, 'text/html');
  const results = [];

  doc.querySelectorAll('li.b_algo').forEach(li => {
    const a = li.querySelector('h2 a');
    const snippet = li.querySelector('.b_caption p, p');
    if (!a) return;

    let url = a.href;
    if (url.includes('bing.com/ck/a') || url.includes('bing.com/ac?')) {
      try {
        const u = new URL(url).searchParams.get('u');
        if (u) url = atob(u.replace(/^a[0-9]+/, ''));
      } catch {}
    }

    results.push({
      url,
      title: a.textContent.trim(),
      content: snippet ? snippet.textContent.trim() : ''
    });
  });

  return results;
}        
  
async function ddgNewsSearch(query, pageno) {
  const s = (pageno - 1) * 30;
  const target = `https://duckduckgo.com/news.js?q=${encodeURIComponent(query)}&o=json&l=us-en&s=${s}&p=1&f=,,,&kp=-2`;

  if (!vqdToken) {
    vqdToken = await getVQD(query);
    if (!vqdToken) return [];
  }
  const target2 = `https://duckduckgo.com/news.js?q=${encodeURIComponent(query)}&vqd=${vqdToken}&o=json&l=us-en&s=${s}&p=1&f=,,,&kp=-2`;   

  const resp = await fetch(target2, {
    headers: { 'User-Agent': UA, 'Accept': 'application/json' },
    signal: AbortSignal.timeout(15000)
  });
  if (!resp.ok) return [];
  const data = await resp.json();

  const results = (data.results || []).map(r => ({
    url: r.url || '', title: r.title || '', content: r.snippet || '',
    source: r.source || r.domain || '', date: r.date || '', thumbnail: r.image || ''
  }));

  if (results.length === 0) vqdToken = '';
  return results;
}   

//\VIDEOS
let pipedInstances = null;

async function youtubeSearch(query, pageno) {
  if (window.electronAPI && window.electronAPI.ytSearch) {
    const data = await window.electronAPI.ytSearch(query, ytPageToken);
    if (data?.token) ytPageToken = data.token;
    const items = Array.isArray(data) ? data : (data?.results || []);
    return items.map(v => ({
      url: `https://www.youtube.com/watch?v=${v.videoId}`,
      thumbnail: v.thumbnail || `https://i.ytimg.com/vi/${v.videoId}/hqdefault.jpg`,
      title: v.title || '',
      channel: v.channel || '',
      duration: v.duration || '',
      source: 'YouTube'
    }));
  }
  return [];
}    

async function archiveVideoSearch(query, pageno) {
  const q = encodeURIComponent(`${query} AND mediatype:movies`);
  const target = `https://archive.org/advancedsearch.php?q=${q}&fl[]=identifier&fl[]=title&fl[]=creator&rows=20&page=${pageno}&output=json&sort[]=downloads+desc`;
  const resp = await fetch(target, { headers: { 'User-Agent': UA }, signal: AbortSignal.timeout(15000) });
  if (!resp.ok) return [];
  const data = await resp.json();
  return (data.response?.docs || []).map(doc => ({
    url: `https://archive.org/details/${doc.identifier}`,
    thumbnail: `https://archive.org/services/img/${doc.identifier}`,
    title: Array.isArray(doc.title) ? doc.title[0] : doc.identifier,
    channel: Array.isArray(doc.creator) ? doc.creator[0] : (doc.creator || ''),   
    duration: '',
    source: 'Internet Archive'
  }));
}   
  
async function videoSearch(query, pageno) {
  const [yt, ia] = await Promise.allSettled([
    youtubeSearch(query, pageno),
    archiveVideoSearch(query, pageno)
  ]);
  const results = [];
  if (yt.status === 'fulfilled') results.push(...yt.value);
  if (ia.status === 'fulfilled') results.push(...ia.value);
  return results;
}   

//\IMAGES
async function getVQD(query) {
const resp = await fetch(`https://duckduckgo.com/?q=${encodeURIComponent(query)}&ia=images&kp=-2`, {   
    headers: { 'User-Agent': UA },
    signal: AbortSignal.timeout(10000)
  });
  const html = await resp.text();
  const match = html.match(/vqd=([\d-]+)/);
  return match ? match[1] : '';
}

async function ddgImageSearch(query, pageno) {
  if (!vqdToken) {
    vqdToken = await getVQD(query);
    if (!vqdToken) return [];
  }
  const s = (pageno - 1) * 100;
  const target = `https://duckduckgo.com/i.js?q=${encodeURIComponent(query)}&vqd=${vqdToken}&o=json&l=us-en&s=${s}&p=1&f=,,,&kp=-2`;   

  const resp = await fetch(target, {
    headers: { 'User-Agent': UA, 'Accept': 'application/json' },
    signal: AbortSignal.timeout(15000)
  });
  if (!resp.ok) return [];
  const data = await resp.json();

  return (data.results || []).map(r => ({
    url: r.url || '',
    img_src: r.image || r.thumbnail || '',
    title: r.title || '',
    source: 'DuckDuckGo'
  }));
}   

async function bingImageSearch(query, pageno) {
const target = `https://www.bing.com/images/search?q=${encodeURIComponent(query)}&first=${(pageno - 1) * 35 + 1}&adlt=on`;   
  
  const resp = await fetch(target, {
    headers: { 'User-Agent': UA, 'Accept-Language': 'en-US,en;q=0.9' },
    signal: AbortSignal.timeout(15000)
  });
  if (!resp.ok) return [];
  const html = await resp.text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const results = [];

  doc.querySelectorAll('a.iusc').forEach(a => {
    try {
      const m = JSON.parse(a.getAttribute('m'));
      if (m.murl) {
        results.push({
          url: m.purl || m.murl,
          img_src: m.murl,
          title: m.t || '',
          source: 'Bing'
        });
      }
    } catch {}
  });

  return results;
}

async function imageSearch(query, pageno) {
  const [ddg, bing] = await Promise.allSettled([
    ddgImageSearch(query, pageno),
    bingImageSearch(query, pageno)
  ]);
  const results = [];
  if (ddg.status === 'fulfilled') results.push(...ddg.value);
  if (bing.status === 'fulfilled') results.push(...bing.value);

  const seen = new Set();
  return results.filter(r => {
    if (seen.has(r.img_src)) return false;
    seen.add(r.img_src);
    return true;
  });
}
  
//\AUDIO

async function itunesSearch(query, pageno) {
  const offset = (pageno - 1) * 25;
  const target = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=25&offset=${offset}`;
  const resp = await fetch(target, {
    headers: { 'User-Agent': UA, 'Accept': 'application/json' },
    signal: AbortSignal.timeout(15000)
  });
  if (!resp.ok) return [];
  const data = await resp.json();

  return (data.results || []).map(t => ({
    url: t.trackViewUrl || '',
    title: `${t.trackName} — ${t.artistName || ''}`,
    audioSrc: t.previewUrl || '',
    thumbnail: t.artworkUrl100?.replace('100x100', '300x300') || '',
    duration: t.trackTimeMillis ? `${Math.floor(t.trackTimeMillis / 60000)}:${String(Math.floor((t.trackTimeMillis % 60000) / 1000)).padStart(2, '0')}` : '',
    source: 'iTunes'
  }));
}

async function archiveAudioSearch(query, pageno) {
  const q = encodeURIComponent(`${query} AND mediatype:audio`);
  const target = `https://archive.org/advancedsearch.php?q=${q}&fl[]=identifier&fl[]=title&fl[]=creator&rows=10&page=${pageno}&output=json&sort[]=downloads+desc`;

  const resp = await fetch(target, {
    headers: { 'User-Agent': UA },
    signal: AbortSignal.timeout(15000)
  });
  if (!resp.ok) return [];
  const data = await resp.json();
  const docs = data.response?.docs || [];

  const results = await Promise.allSettled(
    docs.slice(0, 10).map(async (doc) => {
      const id = doc.identifier;
      try {
        const metaResp = await fetch(`https://archive.org/metadata/${id}`, {
          headers: { 'User-Agent': UA },
          signal: AbortSignal.timeout(8000)
        });
        if (!metaResp.ok) throw new Error('meta failed');
        const meta = await metaResp.json();

        const audioFile = (meta.files || []).find(f =>
          f.source === 'original' &&
          /\.(mp3|ogg|flac|m4a|wav|aac|opus)(\?|$)/i.test(f.name)
        );

        const audioSrc = audioFile
          ? `https://archive.org/download/${id}/${audioFile.name}`
          : '';

        return {
          url: `https://archive.org/details/${id}`,
          title: Array.isArray(doc.title) ? doc.title[0] : (doc.title || id),
          audioSrc,
          thumbnail: `https://archive.org/services/img/${id}`,
          channel: Array.isArray(doc.creator) ? doc.creator[0] : (doc.creator || ''),
          duration: audioFile?.length || '',
          source: 'Internet Archive'
        };
      } catch {
        return {
          url: `https://archive.org/details/${id}`,
          title: Array.isArray(doc.title) ? doc.title[0] : (doc.title || id),
          audioSrc: '',
          thumbnail: `https://archive.org/services/img/${id}`,
          channel: Array.isArray(doc.creator) ? doc.creator[0] : (doc.creator || ''),
          duration: '',
          source: 'Internet Archive'
        };
      }
    })
  );

  return results
    .filter(r => r.status === 'fulfilled')
    .map(r => r.value);
}   

async function audioSearch(query, pageno) {
  const [it, ia] = await Promise.allSettled([
    itunesSearch(query, pageno),
    archiveAudioSearch(query, pageno)
  ]);
  const results = [];
  if (it.status === 'fulfilled') results.push(...it.value);
  if (ia.status === 'fulfilled') results.push(...ia.value);
  return results;
}

  const newImages = [];

  const seen = new Set();

  allData.images.forEach(r => seen.add(r.img_src));
  allData.videos.forEach(r => seen.add(r.thumbnail));
  allData.music.forEach(r => seen.add(r.audioSrc));

  const batch = urls.slice(0, limit);

  for (const pageUrl of batch) {
    try {
      const resp = await fetch(pageUrl, {
        headers: {
          'User-Agent': UA,
          'Accept': 'text/html,application/xhtml+xml'
        },
        signal: AbortSignal.timeout(10000)
      });
      if (!resp.ok) continue;
      const html = await resp.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');

      doc.querySelectorAll('img').forEach(img => {
        
        const rawSrc = img.getAttribute('src') || img.dataset.src || img.dataset.lazySrc || img.dataset.original;
  if (rawSrc && !rawSrc.startsWith('data:') && !rawSrc.startsWith('blob:')) {
    const src = resolveUrl(rawSrc, pageUrl);
    if (!seen.has(src)) {
          const w = parseInt(img.width) || parseInt(img.naturalWidth) || 0;
          if (w > 0 && w < 50) return;
          seen.add(src);
          newImages.push({
            url: pageUrl,
            img_src: src,
            title: img.alt || '',
            source: getDomain(pageUrl)

  };
      });

});

});   

      // Extract audio

  if (rawSrc) {

});

//\ROUTER
async function search(query, category, pageno) {
  switch (category) {
    case 'images': return imageSearch(query, pageno);
    case 'videos': return videoSearch(query, pageno);
    case 'music':  return audioSearch(query, pageno);
    case 'news':   return ddgNewsSearch(query, pageno);
    case 'general':
    default:       return ddgHtmlSearch(query, pageno);
  }
}      

//\SEARCH FLOW
async function doSearch() {
  query = document.getElementById('q').value.trim();
  if (!query) return;
  currentPage = 1;
  vqdToken = '';
  ytPageToken = '';
  ddgNextParams = null;

  const btn = document.getElementById('loadMoreBtn');
  btn.style.display = 'block';
  btn.disabled = true;
  btn.textContent = 'Searching...';
  document.getElementById('status').textContent = '';

  const tabs = ['general', 'news', 'images', 'videos', 'music'];
  allData = { general: [], news: [], images: [], videos: [], music: [] };

  const results = await Promise.allSettled(
    tabs.map((tab, i) =>
      delay(i * 1500).then(() => search(query, tab, 1))
    )
  );

  results.forEach((r, i) => {
  if (r.status === 'fulfilled') {
    const seen = new Set();
    allData[tabs[i]] = r.value.filter(x => {
      if (seen.has(x.url)) return false;
      seen.add(x.url);
      return true;
    });
  } else {
    allData[tabs[i]] = [];
  }
});   

  btn.disabled = false;
  btn.textContent = `Load More (page ${currentPage})`;
  renderTab(currentTab);
const scannable = allData.general.length + allData.news.length;
const scanBtn = document.getElementById('scanBtn');
if (scannable > 0) {
  scanBtn.style.display = 'block';
  scanBtn.textContent = `📡 Scan ${Math.min(scannable, 10)} pages for media`;
}   
}

  async function loadMore() {
  currentPage++;

  const btn = document.getElementById('loadMoreBtn');
  btn.disabled = true;
  btn.textContent = 'Loading...';

  const tabs = ['general', 'news', 'images', 'videos', 'music'];
  const results = await Promise.allSettled(
  tabs.map((tab, i) =>
    delay(i * 3000 + Math.random() * 1000 + 500).then(() => search(query, tab, currentPage))
  )
);   

  results.forEach((r, i) => {
  if (r.status === 'fulfilled' && r.value.length > 0) {
    const existing = new Set(allData[tabs[i]].map(x => x.url));
    const seen = new Set();
    const fresh = r.value.filter(x => {
      if (existing.has(x.url) || seen.has(x.url)) return false;
      seen.add(x.url);
      return true;
    });
    allData[tabs[i]].push(...fresh);
  }
});   
  const currentResults = allData[currentTab];
  const lastBatch = results[tabs.indexOf(currentTab)];
  const hadNew = lastBatch?.status === 'fulfilled' && lastBatch.value.length > 0;

  if (!hadNew) {
    currentPage--;
    btn.textContent = 'No more results';
    btn.disabled = true;
  } else {
    btn.textContent = `Load More (page ${currentPage})`;
  }

  btn.disabled = false;
  renderTab(currentTab);
}    

//\RENDERING
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderTab(tab);
}
function renderTab(tab) {
  const el = document.getElementById('results');
  const results = allData[tab] || [];

  if (tab === 'images') {
    el.innerHTML = `<div class="grid">${results.map(r => `
      <div class="card">
        <img src="${r.img_src}" loading="lazy" alt="" onerror="this.parentElement.style.display='none'">
        <div class="title">${r.title || ''}</div>
        <div style="font-size:10px;color:#999;padding:0 8px 4px;display:flex;align-items:center;gap:4px">
          <img src="https://icons.duckduckgo.com/ip3/${getDomain(r.url)}.ico" style="width:12px;height:12px" alt="">
          ${getDomain(r.url) || r.source || ''}
        </div>
        <a href="${r.url}" target="_blank" style="font-size:11px;color:#4a90d9;padding:0 8px 8px;display:inline-block">Source →</a>
      </div>`).join('')}</div>`;
  } else if (tab === 'videos') {
  el.innerHTML = `<div class="grid">${results.map((r, i) => `
    <div class="card" style="cursor:pointer" onclick="openVideoModal('${r.url}','${(r.title || '').replace(/'/g, "\\'")}')">
      ${r.thumbnail
        ? `<img src="${r.thumbnail}" loading="lazy" alt="">`
        : `<div style="width:100%;aspect-ratio:16/9;background:#1a1a2e;display:flex;align-items:center;justify-content:center">
             <span style="font-size:32px">:(</span>
           </div>`}
      <div class="title">${r.title || ''}</div>
      <div style="font-size:11px;color:#666;padding:0 8px 4px">
        ${r.channel ? '<strong>' + r.channel + '</strong>' : ''} ${r.duration ? '· ' + r.duration : ''}
      </div>
      <div style="font-size:10px;color:#999;padding:0 8px 4px;display:flex;align-items:center;gap:4px">
        <img src="https://icons.duckduckgo.com/ip3/${getDomain(r.url)}.ico" style="width:12px;height:12px" alt="">
        ${r.source || getDomain(r.url)}
      </div>
      <div style="font-size:12px;color:#4a90d9;padding:0 8px 8px">&#9658; Click to play</div>
    </div>`).join('')}</div>`;
}       else if (tab === 'music') {
    el.innerHTML = results.map(r => `
      <div class="audio-item" style="display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee">
        ${r.thumbnail ? `<img src="${r.thumbnail}" style="width:60px;height:60px;border-radius:6px;object-fit:cover" alt="">` : ''}
        <div style="flex:1">
          <div style="font-size:14px">${r.title || r.url}</div>
          <div style="font-size:11px;color:#999;display:flex;align-items:center;gap:4px">
            <img src="https://icons.duckduckgo.com/ip3/${getDomain(r.url)}.ico" style="width:12px;height:12px" alt="">
            ${r.channel ? '<strong>' + r.channel + '</strong> · ' : ''}${r.source || getDomain(r.url)} ${r.duration ? '· ' + r.duration : ''}   
          </div>
          ${r.iframe
  ? `<div style="display:flex;align-items:center;gap:8px;margin-top:6px;padding:8px;background:#f5f5f5;border-radius:8px">
       <img src="https://images.apple.com/badges/originals/podcast/Apple-Podcasts-Logo-Black.png" style="width:20px;height:20px" alt="">
       <a href="${r.iframe}" target="_blank" style="font-size:13px;color:#4a90d9">&#9658; Play on ${r.source || 'Podcast Platform'}</a>
     </div>`
  : r.audioSrc
    ? `<audio src="${r.audioSrc}" controls preload="none" style="width:100%;margin-top:6px;height:32px"></audio>`
    : `<a href="${r.url}" target="_blank" style="font-size:13px;color:#4a90d9">Listen &rarr;</a>`}    
        </div>
      </div>`).join('') || '<p style="color:#999">No audio results found.</p>';
  } else if (tab === 'news') {
    el.innerHTML = results.map(r => `
      <div class="web-result" style="display:flex;gap:12px;align-items:flex-start">
        ${r.thumbnail ? `<img src="${r.thumbnail}" style="width:120px;height:68px;object-fit:cover;border-radius:6px" alt="">` : ''}
        <div style="flex:1">
          <a href="${r.url}" target="_blank">${r.title}</a>
          <div class="snippet">${r.content || ''}</div>
          <div class="url" style="display:flex;align-items:center;gap:6px">
            <img src="https://icons.duckduckgo.com/ip3/${getDomain(r.url)}.ico" style="width:14px;height:14px" alt="">
            ${r.source || getDomain(r.url)} ${r.date ? '· ' + r.date : ''}
          </div>
        </div>
      </div>`).join('') || '<p style="color:#999">No news results found.</p>';
  } else {
    el.innerHTML = results.map(r => `
      <div class="web-result">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
          <img src="https://icons.duckduckgo.com/ip3/${getDomain(r.url)}.ico" 
     style="width:16px;height:16px" alt=""
     onerror="this.src='https://www.google.com/s2/favicons?domain=${getDomain(r.url)}&sz=32'">   
          <span style="font-size:12px;color:#0d652d">${getDomain(r.url)}</span>
        </div>
        <a href="${r.url}" target="_blank">${r.title}</a>
        <div class="snippet">${r.content || ''}</div>
        <div class="url">${r.url}</div>   
      </div>`).join('') || '<p style="color:#999">No results found.</p>';
  }

  document.getElementById('status').textContent = `${results.length} results`;
}    

function getEmbedUrl(url) {
  if (url.includes('archive.org/details/')) {
    const id = url.split('/details/')[1]?.split('?')[0] || '';
    return `https://archive.org/embed/${id}`;
  }
  return url;
}        
  
function openVideoModal(url, title) {
  window.electronAPI.openPopup(getEmbedUrl(url));
}   
  
function closeVideoModal() {
  const modal = document.getElementById('videoModal');
  const player = document.getElementById('videoPlayer');
  modal.style.display = 'none';
  player.innerHTML = '';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeVideoModal();
});
