<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Karat Search</title>
<link rel="icon" type="image/png" href="android-chrome-512x512.png">
<bpds bpds-cntry="us" bpds-toplvldom="search" bpds-dom="bps-orbe" bpds-subdom="karat"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: repo:; media-src 'self' data: https: repo:; frame-src https://www.youtube-nocookie.com; connect-src 'self' https:">
<style>
* { box-sizing: border-box; margin: 0; }
body { font-family: system-ui, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
.search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
.search-bar input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; }
.tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 16px; }
.tab { padding: 10px 18px; cursor: pointer; font-size: 14px; }
.tab.active { border-bottom: 2px solid darkorange; font-weight: 600; color: orange; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.card { border-radius: 8px; overflow: hidden; background-color: lightgrey; }
.card img { width: 100%; height: auto; max-height: 300px; object-fit: contain; }
.card .title { font-size: 13px; padding: 6px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card iframe { width: 100%; aspect-ratio: 16/9; border: none; display: block; }
.card video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
.web-result { margin-bottom: 16px; background-color: lightgrey; border-radius: 8px; padding: 10px; }
.web-result a { font-size: 15px; color: black; text-decoration: none; }
.web-result .snippet { font-size: 13px; color: #545454; margin-top: 4px; }
.web-result .url { font-size: 12px; color: darkcyan; }
.audio-item { margin-bottom: 10px; background-color: lightgrey; border-radius: 8px; padding: 10px; }
.audio-item audio { width: 100%; margin-top: 6px; }
.load-more { display: block; margin: 16px auto; padding: 10px 28px; cursor: pointer; font-size: 14px; border: 1px solid #ddd; border-radius: 6px; background: #fff; }
.load-more:disabled { opacity: 0.5; }
.status { text-align: center; font-size: 12px; color: #999; margin-top: 8px; }
</style>
</head>
<body>

<div class="search-bar">
  <input id="q" type="text" placeholder="Search..." onkeydown="if(event.key==='Enter')doSearch()">
  <button onclick="doSearch()" style="padding:10px 20px;border:none;border-radius:6px;background:orange;color:#fff;cursor:pointer">Search</button>
</div>

<div class="tabs">
  <div class="tab active" data-tab="general" onclick="switchTab('general')">Web</div>
  <div class="tab" data-tab="news" onclick="switchTab('news')">News</div>
  <div class="tab" data-tab="images" onclick="switchTab('images')">Images</div>
  <div class="tab" data-tab="videos" onclick="switchTab('videos')">Videos</div>
  <div class="tab" data-tab="music" onclick="switchTab('music')">Audio</div>
</div>

<div id="results"></div>
<button class="load-more" id="loadMoreBtn" onclick="loadMore()" style="display:none">Load More</button>
<div class="status" id="status"></div>

<script>
const params = new URLSearchParams(window.location.search);
const initialQuery = params.get('q');
if (initialQuery) {
  document.getElementById('q').value = initialQuery;
  setTimeout(() => doSearch(), 300);
}

const CATEGORIES = { general: 'general', news: 'news', images: 'images', videos: 'videos', music: 'music' };
let currentTab = 'general';
let allData = { general: [], news: [], images: [], videos: [], music: [] };
let currentPage = 1;
let query = '';

function getDomain(url) {
  try { return new URL(url).hostname.replace('www.', ''); }
  catch { return ''; }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function doSearch() {
  query = document.getElementById('q').value.trim();
  if (!query) return;
  currentPage = 1;
  allData = { general: [], news: [], images: [], videos: [], music: [] };

  const btn = document.getElementById('loadMoreBtn');
  btn.style.display = 'block';
  btn.disabled = true;
  btn.textContent = 'Searching...';
  document.getElementById('status').textContent = '';

  const tabs = ['general', 'news', 'images', 'videos', 'music'];
  const results = await Promise.allSettled(
    tabs.map(tab => electronAPI.karatSearch(query, CATEGORIES[tab], 1))
  );

  results.forEach((r, i) => {
    if (r.status === 'fulfilled' && Array.isArray(r.value)) {
      allData[tabs[i]] = r.value;
    } else {
      allData[tabs[i]] = [];
    }
  });

  // Crawl top web results for media (background)
  const webUrls = allData.general.slice(0, 5).map(r => r.url);
  if (webUrls.length > 0) {
    document.getElementById('status').textContent = 'Extracting media...';
    const media = await electronAPI.karatExtractMedia(webUrls);
    if (media) {
      const seen = new Set(allData.images.map(r => r.img_src));
      allData.images.push(...(media.images || []).filter(i => !seen.has(i.img_src)));
      const seenV = new Set(allData.videos.map(r => r.url));
      allData.videos.push(...(media.videos || []).filter(v => !seenV.has(v.url)));
      const seenA = new Set(allData.music.map(r => r.audioSrc || r.url));
      allData.music.push(...(media.audio || []).filter(a => !seenA.has(a.audioSrc || a.url)));
    }
  }

  btn.disabled = false;
  btn.textContent = `Load More (page ${currentPage})`;
  document.getElementById('status').textContent = '';
  renderTab(currentTab);
}

async function loadMore() {
  currentPage++;
  const btn = document.getElementById('loadMoreBtn');
  btn.disabled = true;
  btn.textContent = 'Loading...';

  const tabs = ['general', 'news', 'images', 'videos', 'music'];
  let newWebUrls = [];
  let hadNewResults = false;

  for (let i = 0; i < tabs.length; i++) {
    try {
      const r = await electronAPI.karatSearch(query, CATEGORIES[tabs[i]], currentPage);
      if (Array.isArray(r) && r.length > 0) {
        hadNewResults = true;
        const isImages = tabs[i] === 'images';
        const existing = new Set(allData[tabs[i]].map(x => isImages ? (x.img_src || x.url) : x.url));
        const fresh = r.filter(x => {
          const key = isImages ? (x.img_src || x.url) : x.url;
          return !existing.has(key);
        });
        allData[tabs[i]].push(...fresh);
        if (tabs[i] === 'general') newWebUrls = fresh.map(x => x.url);
      }
    } catch { /* skip */ }
    if (i < tabs.length - 1) await new Promise(r => setTimeout(r, 800));
  }

  if (newWebUrls.length > 0) {
    document.getElementById('status').textContent = 'Extracting media...';
    const media = await electronAPI.karatExtractMedia(newWebUrls.slice(0, 3));
    if (media) {
      const seenI = new Set(allData.images.map(r => r.img_src));
      allData.images.push(...(media.images || []).filter(i => !seenI.has(i.img_src)));
      const seenV = new Set(allData.videos.map(r => r.url));
      allData.videos.push(...(media.videos || []).filter(v => !seenV.has(v.url)));
      const seenA = new Set(allData.music.map(r => r.audioSrc || r.url));
      allData.music.push(...(media.audio || []).filter(a => !seenA.has(a.audioSrc || a.url)));
    }
  }

  if (!hadNewResults) {
    currentPage--;
    btn.textContent = 'No more results';
    btn.disabled = true;
  } else {
    btn.textContent = `Load More (page ${currentPage})`;
  }
  btn.disabled = false;
  document.getElementById('status').textContent = '';
  renderTab(currentTab);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderTab(tab);
}

function renderTab(tab) {
  const el = document.getElementById('results');
  const results = allData[tab] || [];

  if (tab === 'images') {
    el.innerHTML = `<div class="grid">${results.map(r => `
      <div class="card">
        <img src="${escapeHtml(r.img_src)}" loading="lazy" alt="" onerror="this.parentElement.style.display='none'">
        <div class="title">${escapeHtml(r.title || '')}</div>
        <div style="font-size:10px;color:#999;padding:0 8px 4px">${escapeHtml(getDomain(r.url) || r.source || '')}</div>
        <a href="${escapeHtml(r.url)}" target="_blank" style="font-size:11px;color:#4a90d9;padding:0 8px 8px;display:inline-block">Source &rarr;</a>
      </div>`).join('')}</div>`;

  } else if (tab === 'videos') {
    el.innerHTML = `<div class="grid">${results.map(r => {
      const ytMatch = r.url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
      const isDirectVideo = /\.(mp4|webm|ogg|mov)(\?|$)/i.test(r.url);
      let playerHtml = '';
      if (ytMatch) {
        playerHtml = `<iframe src="https://www.youtube-nocookie.com/embed/${ytMatch[1]}?rel=0" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe>`;
      } else if (isDirectVideo) {
        playerHtml = `<video src="${escapeHtml(r.url)}" controls preload="none"></video>`;
      } else if (r.thumbnail) {
        playerHtml = `<img src="${escapeHtml(r.thumbnail)}" loading="lazy" alt="">`;
      }
      const clickable = !ytMatch && !isDirectVideo;
      return `
        <div class="card" style="cursor:${clickable ? 'pointer' : 'default'}" ${clickable ? `onclick="window.electronAPI.openPopup('${escapeHtml(r.url)}')"` : ''}>
          ${playerHtml}
          <div class="title">${escapeHtml(r.title || '')}</div>
          <div style="font-size:11px;color:#666;padding:0 8px 4px">${escapeHtml(r.channel || '')} ${r.duration ? '· ' + escapeHtml(r.duration) : ''}</div>
        </div>`;
    }).join('')}</div>`;

  } else if (tab === 'music') {
    el.innerHTML = results.map(r => {
      const isDirectAudio = /\.(mp3|ogg|wav|flac|m4a|aac|webm)(\?|$)/i.test(r.url);
      let playerHtml = '';
      if (r.audioSrc) {
        playerHtml = `<audio src="${escapeHtml(r.audioSrc)}" controls preload="none"></audio>`;
      } else if (isDirectAudio) {
        playerHtml = `<audio src="${escapeHtml(r.url)}" controls preload="none"></audio>`;
      } else {
        playerHtml = `<a href="javascript:void(0)" onclick="window.electronAPI.openPopup('${escapeHtml(r.url)}')" style="font-size:13px;color:#4a90d9;cursor:pointer">▶ Play</a>`;
      }
      return `
        <div class="audio-item" style="display:flex;gap:12px;align-items:center">
          ${r.thumbnail ? `<img src="${escapeHtml(r.thumbnail)}" style="width:50px;height:50px;border-radius:6px;object-fit:cover" alt="">` : ''}
          <div style="flex:1">
            <div style="font-size:14px">${escapeHtml(r.title || r.url)}</div>
            <div style="font-size:11px;color:#999">${escapeHtml(r.channel || '')} ${escapeHtml(r.source || '')} ${r.duration ? '· ' + escapeHtml(r.duration) : ''}</div>
            ${playerHtml}
          </div>
        </div>`;
    }).join('') || '<p style="color:#999">No audio results found.</p>';

  } else if (tab === 'news') {
    el.innerHTML = results.map(r => `
      <div class="web-result" style="display:flex;gap:12px;align-items:flex-start">
        ${r.thumbnail ? `<img src="${escapeHtml(r.thumbnail)}" style="width:120px;height:68px;object-fit:cover;border-radius:6px" alt="">` : ''}
        <div style="flex:1">
          <a href="${escapeHtml(r.url)}" target="_blank">${escapeHtml(r.title)}</a>
          <div class="snippet">${escapeHtml(r.content || '')}</div>
          <div class="url">${escapeHtml(r.source || getDomain(r.url))} ${r.date ? '· ' + escapeHtml(r.date) : ''}</div>
        </div>
      </div>`).join('') || '<p style="color:#999">No news results found.</p>';

  } else {
    el.innerHTML = results.map(r => `
      <div class="web-result">
        <div style="font-size:12px;color:#0d652d;margin-bottom:2px">${escapeHtml(getDomain(r.url))}</div>
        <a href="${escapeHtml(r.url)}" target="_blank">${escapeHtml(r.title)}</a>
        <div class="snippet">${escapeHtml(r.content || '')}</div>
        <div class="url">${escapeHtml(r.url)}</div>
      </div>`).join('') || '<p style="color:#999">No results found.</p>';
  }

  document.getElementById('status').textContent = `${results.length} results`;
}
</script>
</body>
</html>
